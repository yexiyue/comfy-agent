services:
  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_USER: comfy_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comfy_agent_local}
      POSTGRES_DB: comfy_agent
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comfy_agent -d comfy_agent"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  agent-postgres:
