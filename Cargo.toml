[package]
name = "comfy-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
genai = "0.7.0-rc.1"                                     # LLM 多厂商适配层（02 篇开始用）
tokio = { version = "1", features = ["full"] }           # 异步运行时
serde_json = "1"                                          # 工具 schema / 参数都是 JSON
dotenvy = "0.15"                                          # .env 加载
anyhow = "1"                                              # 错误类型统一
tracing = "0.1"                                           # 结构化日志（17 篇升级为观测主干）
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3.34"
