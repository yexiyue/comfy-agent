[workspace]
members = ["crates/*"]
default-members = ["crates/agent"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
agent = { path = "crates/agent" }
tools = { path = "crates/tools" }
tool-macros = { path = "crates/tool-macros" }
genai = "0.7.0-rc.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
schemars = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
telemetry = { path = "crates/telemetry" }
runtime = { path = "crates/runtime" }
persistence = { path = "crates/persistence" }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
opentelemetry-otlp = { version = "0.33", features = ["http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.34"
regex = "1"
sha2 = "0.10"
url = "2"
toasty = { version = "=0.11.0", features = ["postgresql", "migration", "serde"] }
toasty-driver-postgresql = "=0.11.0"
apalis = "=1.0.0-rc.10"
apalis-postgres = "=1.0.0-rc.9"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
