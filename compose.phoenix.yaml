services:
  phoenix:
    image: arizephoenix/phoenix:20.19.0@sha256:d240d8d4e364ee3483ed2de41ec12b760cc90bb0d4c6e2f190388772aba6fe1f
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
    volumes:
      - phoenix-data:/mnt/data
    restart: unless-stopped
volumes:
  phoenix-data:
